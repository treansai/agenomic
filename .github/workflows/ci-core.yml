# Core (public) gate: the shared crates build and test, the submodule pointers
# are reachable, the licence metadata matches scripts/license/packages.tsv, no
# secret and no proprietary marker is present in the tree.
# Runs with the default GITHUB_TOKEN only; a fork's pull request gets no secret.
name: ci-core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: third-party actions are pinned to commit SHAs
        run: ./scripts/ci/check-action-pins.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.10@sha256:ef8299f97635c4c30e2298f48f30763ab782a4ad2c95b744649439a039421e36 -color
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -S warning scripts/ci/*.sh scripts/release/*.sh scripts/github/*.sh scripts/license/*.sh
      - name: licence checks
        run: ./scripts/license/check-all.sh
      - name: licence checks are themselves tested
        run: ./scripts/license/test-license-checks.sh
      - name: proprietary leak scan
        run: ./scripts/ci/proprietary-leak-check.sh
      - name: submodule pointers are reachable on their public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/check-submodule-pointers.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --no-banner --redact=100 --exit-code 1 /repo

  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: third-party licences of the shared crates
        run: ./scripts/release/third-party-licenses.sh --check
