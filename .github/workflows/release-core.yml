# Core release: tag `core-vMAJOR.MINOR.PATCH` on `main` → verified tree →
# SBOM + provenance attestation on the source archive → GitHub release with
# generated notes. Cloud picks the release up through its sync bot
# (agenomic-cloud/.github/workflows/sync-core.yml); nothing here reaches a
# private repository or a deployment.
name: release-core

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release/verify-core-tag.sh --tag "$TAG" --output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/license/check-all.sh
      - run: ./scripts/ci/proprietary-leak-check.sh
      - name: gitleaks (release tree)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --no-banner --redact=100 --exit-code 1 /repo

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="agenomic-core-${TAG#core-v}/" -o "dist/agenomic-core-${TAG#core-v}.tar.gz" HEAD
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: the source archive carries the licence
        run: |
          set -euo pipefail
          tar -tzf dist/*.tar.gz > dist/archive.list
          grep -qE '^[^/]+/LICENSE$' dist/archive.list
          tar -xzOf dist/*.tar.gz --wildcards '*/LICENSE' > dist/archive.LICENSE
          . ./scripts/license/lib.sh
          is_agpl_text dist/archive.LICENSE
          rm -f dist/archive.list dist/archive.LICENSE
      - name: third-party licences
        run: ./scripts/release/third-party-licenses.sh --output dist/THIRD_PARTY_LICENSES.md
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/agenomic-core.spdx.json
          upload-artifact: false
      - name: provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Core ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/agenomic-core.spdx.json
            dist/THIRD_PARTY_LICENSES.md
